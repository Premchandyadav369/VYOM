<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VYOM | Intent Firewall for Digital Payments — Red Noir Platform</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Iconify Icons CDN -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- Google Fonts: Manrope, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Modular CSS Architecture -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/workspace.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23000000'/><rect x='30' y='30' width='40' height='40' rx='6' transform='rotate(45 50 50)' fill='%23ef233c'/><text x='50' y='60' font-size='32' font-weight='900' text-anchor='middle' fill='%23ffffff' font-family='sans-serif'>V</text></svg>">

  <style>
    /* Custom Red Noir Keyframe Animations */
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes border-spin {
      from { --gradient-angle: 0deg; }
      to { --gradient-angle: 360deg; }
    }

    @keyframes shimmer {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes animStar {
      from { transform: translateY(0px); }
      to { transform: translateY(-2000px); }
    }

    @property --gradient-angle { 
      syntax: "<angle>"; 
      initial-value: 0deg; 
      inherits: false; 
    }

    .animate-fade-up {
      animation: fade-in-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .font-manrope { font-family: 'Manrope', sans-serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    /* Red Noir Shiny CTA Button */
    .shiny-cta {
      --gradient-angle: 0deg;
      position: relative;
      overflow: hidden;
      border-radius: 9999px;
      padding: 0.45rem 1.15rem;
      background: linear-gradient(#050507, #050507) padding-box,
      conic-gradient(from var(--gradient-angle), transparent 0%, #ef233c 5%, #ef233c 20%, #ef233c 35%, transparent 45%, transparent 100%) border-box;
      border: 1.5px solid transparent;
      cursor: pointer;
      isolation: isolate;
      animation: border-spin 3s linear infinite;
      box-shadow: 0 0 20px rgba(239, 35, 60, 0.25);
      transition: all 0.2s ease;
    }

    .shiny-cta:hover {
      box-shadow: 0 0 28px rgba(239, 35, 60, 0.45);
      transform: translateY(-1px);
    }

    .shiny-cta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, white 0.5px, transparent 0);
      background-size: 4px 4px;
      opacity: 0.1;
      z-index: 0;
    }

    /* Parallax Stars */
    .stars-1 {
      box-shadow: 234px 124px #fff, 654px 345px #fff, 876px 12px #fff, 1200px 800px #fff, 400px 1500px #fff, 1800px 200px #fff, 100px 1000px #fff, 900px 1900px #fff, 500px 600px #fff, 1400px 100px #fff, 300px 400px #fff, 1600px 1200px #fff;
    }
    .stars-2 {
      box-shadow: 123px 456px #fff, 789px 234px #fff, 456px 890px #fff, 1100px 300px #fff, 200px 1200px #fff, 1500px 500px #fff, 600px 1700px #fff, 1300px 900px #fff;
    }

    .gradient-blur {
      position: fixed;
      z-index: 30;
      inset: 0 0 auto 0;
      height: 90px;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      backdrop-filter: blur(8px);
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    ::selection {
      background: #ef233c;
      color: #ffffff;
    }

    .text-stroke {
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.08);
      color: transparent;
    }

    .glow-red {
      box-shadow: 0 0 25px rgba(239, 35, 60, 0.35);
    }

    .glow-card {
      background: radial-gradient(circle at 50% 0%, rgba(239, 35, 60, 0.06) 0%, rgba(10, 10, 14, 0.95) 75%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .glow-card:hover {
      border-color: rgba(239, 35, 60, 0.3);
      box-shadow: 0 8px 32px rgba(239, 35, 60, 0.12);
    }
  </style>
</head>
<body class="bg-black text-white font-inter relative overflow-hidden select-none">

  <!-- Ambient Red Noir Background Layers -->
  <div class="fixed inset-0 z-0 pointer-events-none">
    <div class="absolute inset-0 bg-gradient-to-b from-[#160305] via-[#090203] to-black"></div>
    <div class="absolute top-0 left-0 w-[1px] h-[1px] bg-transparent stars-1 animate-[animStar_60s_linear_infinite]"></div>
    <div class="absolute top-0 left-0 w-[2px] h-[2px] bg-transparent stars-2 animate-[animStar_90s_linear_infinite]"></div>
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[900px] h-[600px] bg-red-600/8 rounded-full blur-[140px]"></div>
    <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:40px_40px] [mask-image:radial-gradient(circle_at_center,black_40%,transparent_80%)]"></div>
  </div>

  <!-- Top Ambient Blur Mask -->
  <div class="gradient-blur"></div>

  <!-- Master Application Shell -->
  <div class="app-shell relative z-10 flex h-screen w-screen overflow-hidden">
    <!-- Permanent Left Navigation -->
    <aside class="app-sidebar" id="app-sidebar"></aside>

    <!-- Main Workstation View Area -->
    <main class="app-main flex-1 flex flex-col h-full min-w-0 overflow-hidden relative">
      <!-- Topbar Header -->
      <header class="topbar" id="app-topbar"></header>

      <!-- Content Workspace -->
      <section class="workspace-content flex-1 overflow-y-auto" id="view-container"></section>

      <!-- Persistent Bottom Status Strip -->
      <footer class="bottom-statusbar flex-shrink-0" id="app-statusbar"></footer>
    </main>
  </div>

  <!-- Modular Vanilla JavaScript Entry Point -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
